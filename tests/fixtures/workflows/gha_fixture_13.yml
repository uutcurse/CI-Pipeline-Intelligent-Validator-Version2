name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request:
    branches:
    - '*'
env: {}
defaults: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: null
jobs:
  ci:
    name: ci
    needs: null
    if: null
    environment: null
    concurrency: null
    outputs: {}
    env: {}
    defaults: {}
    strategy: null
    container: null
    services: {}
    steps:
    - index: 0
      name: Checkout code
      id: null
      if: null
      uses: actions/checkout@v5
      run: null
      shell: null
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 1
      name: Setup Node.js
      id: null
      if: null
      uses: actions/setup-node@v4
      run: null
      shell: null
      with:
        node-version: 22.x
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 2
      name: Setup pnpm
      id: null
      if: null
      uses: pnpm/action-setup@v4
      run: null
      shell: null
      with:
        version: 10.10.0
        run_install: false
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 3
      name: Get pnpm store directory
      id: null
      if: null
      uses: null
      run: 'echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

        '
      shell: bash
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 4
      name: Prepare directories
      id: null
      if: null
      uses: null
      run: 'mkdir -p agents-docs/.source

        touch agents-docs/.source/index.ts

        '
      shell: null
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 5
      name: Setup pnpm cache
      id: null
      if: null
      uses: actions/cache@v4
      run: null
      shell: null
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: '${{ runner.os }}-pnpm-store-

          '
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 6
      name: Setup Turborepo cache
      id: null
      if: null
      uses: actions/cache@v4
      run: null
      shell: null
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: '${{ runner.os }}-turbo-

          '
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 7
      name: Install dependencies
      id: null
      if: null
      uses: null
      run: 'pnpm install --frozen-lockfile

        # Ensure agents-manage-ui dependencies are properly installed

        cd agents-manage-ui && pnpm install --frozen-lockfile && cd ..

        '
      shell: null
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 8
      name: Clean database files
      id: null
      if: null
      uses: null
      run: 'echo "Cleaning up any existing database files..."

        find . -name "*.db" -o -name "*.sqlite" | grep -v node_modules | xargs -r
        rm -f

        '
      shell: null
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 9
      name: Run CI checks
      id: ci-check
      if: null
      uses: null
      run: "set -e\nEXIT_CODE=0\n\necho \"::group::Build\"\nif ! pnpm turbo build\
        \ --output-logs=errors-only; then\n  echo \"::error title=Build Failed::The\
        \ build task failed. Check the logs for compilation errors.\"\n  EXIT_CODE=1\n\
        else\n  echo \"\u2705 Build passed\"\nfi\necho \"::endgroup::\"\n\necho \"\
        ::group::Lint\"\nif ! pnpm turbo lint --output-logs=errors-only --continue;\
        \ then\n  echo \"::warning title=Lint Failed::Linting errors detected. Run\
        \ 'pnpm lint' locally to see details.\"\n  # Don't fail CI for lint errors\
        \ for now - can be made strict later\n  # EXIT_CODE=1\nelse\n  echo \"\u2705\
        \ Lint passed\"\nfi\necho \"::endgroup::\"\n\necho \"::group::Typecheck\"\n\
        if ! pnpm turbo typecheck --output-logs=errors-only --continue; then\n  echo\
        \ \"::warning title=Typecheck Issues::TypeScript type checking has issues.\
        \ Run 'pnpm typecheck' locally to see details.\"\n  # Don't fail CI for typecheck\
        \ errors for now - can be made strict later\n  # EXIT_CODE=1\nelse\n  echo\
        \ \"\u2705 Typecheck passed\"\nfi\necho \"::endgroup::\"\n\necho \"::group::Test\"\
        \nif ! pnpm turbo test --output-logs=errors-only; then\n  echo \"::error title=Test\
        \ Failed::Tests failed. Run 'pnpm test' locally to see details.\"\n  EXIT_CODE=1\n\
        else\n  echo \"\u2705 Tests passed\"\nfi\necho \"::endgroup::\"\n\n# Fail\
        \ the CI if any critical checks failed (build or test)\nif [ $EXIT_CODE -ne\
        \ 0 ]; then\n  echo \"::error::CI failed due to build or test failures. See\
        \ details above.\"\nfi\nexit $EXIT_CODE\n"
      shell: null
      with: {}
      env:
        TURBO_TELEMETRY_DISABLED: 1
        TURBO_CACHE_DIR: .turbo
        TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        ENVIRONMENT: test
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-ci-testing'
          }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-test-key-for-ci-testing'
          }}
        DB_FILE_NAME: test.db
        NODE_OPTIONS: --max-old-space-size=4096
        CI: true
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    - index: 10
      name: Create CI Summary
      id: null
      if: always()
      uses: null
      run: "echo \"## CI Run Summary\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        \nif [ \"${{ steps.ci-check.outcome }}\" == \"success\" ]; then\n  echo \"\
        \u2705 **All CI checks passed successfully!**\" >> $GITHUB_STEP_SUMMARY\n\
        else\n  echo \"\u274C **CI checks failed**\" >> $GITHUB_STEP_SUMMARY\n  echo\
        \ \"\" >> $GITHUB_STEP_SUMMARY\n  echo \"**Critical failures will block merging.\
        \ Fix build and test failures before proceeding.**\" >> $GITHUB_STEP_SUMMARY\n\
        fi\n\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"### Task Results:\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Build: Check logs for status\" >> $GITHUB_STEP_SUMMARY\necho \"-\
        \ Lint: \u26A0\uFE0F Has warnings (non-blocking)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Typecheck: \u26A0\uFE0F Has warnings (non-blocking)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Test: Check logs for status\" >> $GITHUB_STEP_SUMMARY\n\necho \"\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"### Note:\" >> $GITHUB_STEP_SUMMARY\necho\
        \ \"Build and Test failures will fail the CI. Lint and Typecheck issues are\
        \ shown as warnings.\" >> $GITHUB_STEP_SUMMARY\n"
      shell: null
      with: {}
      env: {}
      continue-on-error: false
      timeout-minutes: null
      working-directory: null
    step_count: 11
    runs-on: ubuntu-latest
    timeout-minutes: null
    continue-on-error: false
