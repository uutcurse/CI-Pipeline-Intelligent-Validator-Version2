[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-pipeline-intelligent-validator-v2"
version = "0.1.0"
description = "Research-oriented three-class CI/CD workflow execution-risk prediction system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "transformers",
    "ruamel.yaml",
    "pyyaml",
    "networkx",
    "xgboost",
    "shap",
    "captum",
    "mlflow",
    "pandera",
    "fastapi",
    "streamlit",
    "pytest"
]
